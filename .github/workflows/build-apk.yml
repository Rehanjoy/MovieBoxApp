name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone MovieBox APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Native Android Scaffold
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Scaffolding native Android project files..."
            npx --yes @react-native-community/cli@11 init TempApp --version 0.72.6 --skip-install --npm
            cp -r TempApp/android ./android
            rm -rf TempApp
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android Debug APK (Installable Universal APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload MovieBox APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
