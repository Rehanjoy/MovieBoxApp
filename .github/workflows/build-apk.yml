name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Standalone MovieBox APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Prepare Native Android Scaffold
        run: |
          if [ ! -f "android/gradlew" ]; then
            echo "Scaffolding native Android project for MovieBox..."
            npx --yes @react-native-community/cli@11 init MovieBoxApp --version 0.72.6 --skip-install --npm
            cp -r MovieBoxApp/android ./android
            rm -rf MovieBoxApp
          fi

      - name: Ensure Debug Keystore Exists
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating debug keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Configure Standalone Release Signing & Cleartext Traffic
        run: |
          # Allow cleartext HTTP streams for IPTV .m3u8
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true
          # Ensure release APK uses debug keystore for easy installation on all devices
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/app/build.gradle || true

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Standalone Offline Release APK
        run: |
          cd android
          # assembleRelease builds standalone offline APK with bundled JS (NO Metro dev server needed!)
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p release-output
          find android/app/build/outputs/apk/release/ -name "*.apk" -exec cp {} release-output/MovieBox-v3.0.apk \;
          echo "Generated APK:"
          ls -la release-output/

      - name: Upload MovieBox APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MovieBox-Android-APK
          path: release-output/MovieBox-v3.0.apk
          retention-days: 30

      - name: Update GitHub Release Asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 release-output/MovieBox-v3.0.apk --clobber || true
